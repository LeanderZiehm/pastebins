<!DOCTYPE html>
<html>
<head>
    <title>Create Paste</title>
    <style>
        body {
            font-family: monospace;
            max-width: 900px;
            margin: 2rem auto;
        }
        textarea {
            width: 100%;
            height: 70vh;
            font-family: monospace;
            font-size: 14px;
        }
        button {
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>Create Paste: /{{ slug }}</h1>

    <form method="post">
        <textarea name="content" required placeholder="Paste text here..."></textarea>
        <br />
        <button type="submit">Save</button>
    </form>
</body>
</html>
