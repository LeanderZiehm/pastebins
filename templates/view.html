<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>/{{ slug }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fira Code', monospace;
            max-width: 900px;
            margin: 2rem auto;
            background: #f9f9fb;
            color: #1a1a1a;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        pre {
            white-space: pre-wrap;
            word-break: break-word;
            background: #fff;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            font-size: 15px;
        }
        a.button {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.75rem 1.5rem;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            background: #4f46e5;
            color: #fff;
            text-decoration: none;
            transition: background 0.2s;
        }
        a.button:hover {
            background: #3730a3;
        }
    </style>
</head>
<body>
    <h1>/{{ slug }} v2</h1>
 <pre>{{ content }}</pre>
