<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Required - /{{ slug }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fira Code', monospace;
            max-width: 500px;
            margin: 3rem auto;
            background: #f9f9fb;
            color: #1a1a1a;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            background: #fff;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        input[type="password"] {
            width: 100%;
            padding: 1rem;
            margin-top: 1rem;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: #f6f6f6;
        }
        button {
            margin-top: 1.5rem;
            width: 100%;
            padding: 0.75rem;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            background: #4f46e5;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #3730a3;
        }
        p.error {
            color: #b91c1c;
            font-weight: bold;
            margin-top: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Password Protected</h1>
    {% if error %}
    <p class="error">Incorrect password, try again!</p>
    {% endif %}
    <form method="get" action="/{{ slug }}">
        <input type="password" name="password" placeholder="Enter password" required>
        <button type="submit">View Paste</button>
    </form>
</body>
</html>
